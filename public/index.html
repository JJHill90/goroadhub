<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GoRoadHub – Driver Groups in One Place</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1877F2">
<style>
:root{--bg:#F0F2F5;--card:#fff;--tx:#050505;--mut:#65676B;--bl:#1877F2;--bl2:#E7F3FF;--bd:#CED0D4;--hov:#F2F2F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#18191A;--card:#242526;--tx:#E4E6EB;--mut:#B0B3B8;--bl:#2D88FF;--bl2:#263951;--bd:#3E4042;--hov:#3A3B3C}}
:root[data-theme=dark]{--bg:#18191A;--card:#242526;--tx:#E4E6EB;--mut:#B0B3B8;--bl:#2D88FF;--bl2:#263951;--bd:#3E4042;--hov:#3A3B3C}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:var(--bl);color:#fff;font:700 24px/40px Georgia,serif;text-align:center}
.brand{font-weight:800;color:var(--bl);font-size:20px}
header input{flex:1;min-width:120px;max-width:300px;border:0;background:var(--bg);color:var(--tx);border-radius:20px;padding:9px 14px;font-size:15px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:none;color:var(--mut);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{background:var(--hov)}nav button.on{color:var(--bl);border-bottom-color:var(--bl);border-radius:8px 8px 0 0}
#tkw{background:var(--bl);color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;display:flex}
#tkw b{background:#0b4fb3;padding:6px 12px;z-index:2;flex:none}
#tk{display:inline-block;padding:6px 0;animation:mq 70s linear infinite}#tkw:hover #tk{animation-play-state:paused}
#tk span{margin:0 28px}#tk i{opacity:.75;font-style:normal;font-weight:700;margin-right:6px}#tk i.rm{background:#fff;color:#E41E3F;opacity:1;font-weight:800;border-radius:10px;padding:1px 9px}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){#tk,.dot,.gate-title,.truck,.wheel,.lane,.cloud,.puff{animation:none}.truck{left:12%}}
main{max-width:1060px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:900px){main.two{grid-template-columns:minmax(0,1fr) 290px}}
.card{background:var(--card);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.15);padding:12px 14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex:none;border:0;background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tab.on{background:var(--bl);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,textarea,input.f{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font:inherit}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--bl2);color:var(--bl);border-color:var(--bl);font-weight:600}
.post .top{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;flex:none;color:#fff;font-weight:700;display:grid;place-items:center}
.nm{font-weight:600}.sub{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--bl2);color:var(--bl);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;margin-top:6px}
.acts{display:flex;border-top:1px solid var(--bd);margin-top:10px;padding-top:4px}
.acts button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px}
.acts button:hover{background:var(--hov)}.acts button.on{color:var(--bl)}
.btn{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.g{background:var(--bg);color:var(--tx)}
.lk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lk:last-child{border:0}.lk input{flex:1;min-width:140px}
.star{cursor:pointer;font-size:20px;background:none;border:0;color:var(--mut)}.star.on{color:#F7B928}
.fl{color:var(--bl);background:none;border:0;cursor:pointer;font-weight:600;font-size:13px;padding:0 0 0 6px}
#wg{position:fixed;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:290px;max-width:calc(100vw - 24px);z-index:30;background:var(--card);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.3);overflow:hidden;border:1px solid var(--bd)}
#wg h4{margin:0;background:var(--bl);color:#fff;padding:7px 12px;font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
#wgb{padding:10px 12px;cursor:pointer;font-size:13px;transition:opacity .3s}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#31A24C;margin-right:6px;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.3}}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:700 9px/1 system-ui,sans-serif;vertical-align:middle;margin-right:5px;flex:none}.ico.fb{font:700 14px/1 Georgia,serif}.ico.main{font-size:8px}#tk .ico{border:1.5px solid #fff;margin-right:6px}
.mag{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-flow:dense;gap:12px}.tile{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.2);display:flex;flex-direction:column}.tile.big{grid-column:span 2;grid-row:span 2}.tile .ph{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}.tile.big .ph{aspect-ratio:auto;flex:1;min-height:220px}.tile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pi{color:#fff;font:800 34px system-ui;opacity:.85}.tb{padding:10px 12px 12px}.ht{font-weight:700;font-size:16px;line-height:1.25;margin-top:4px}.tile.big .ht{font-size:22px}@media(max-width:560px){.tile.big{grid-column:span 1;grid-row:span 1}}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;gap:6px;align-items:center;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}#pl .pt{flex:1;min-width:0}#pl .pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pl input{width:100%}#pl button{border:0;background:var(--bg);color:var(--tx);border-radius:10px;min-width:54px;height:54px;font-size:15px;font-weight:700;cursor:pointer}#pl button.pp{background:var(--bl);color:#fff;min-width:64px;font-size:22px}nav{overflow-x:auto;max-width:100%}
.note{background:var(--bl2);border-left:4px solid var(--bl);padding:10px 12px;border-radius:4px;font-size:13.5px;margin:8px 0}
h3{margin:0 0 8px}.mut{color:var(--mut)}
.opt{border:2px solid var(--bd);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}.opt.on{border-color:var(--bl);background:var(--bl2)}
@media(max-width:600px){nav button{padding:8px 8px;font-size:12px}.brand{display:none}}
.btn,.acts button,nav button,.chip{min-height:44px}
.replies{margin-top:8px}
.cab-btn{width:100%;min-height:64px;font-size:18px;margin-top:10px}
.story-hit{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-top:1px solid var(--bd);padding:16px 14px;cursor:pointer;min-height:76px;font:inherit}
.story-hit b{display:block;font-size:18px;line-height:1.35;margin-top:4px}
.offbar{background:#E41E3F;color:#fff;border-radius:8px;padding:10px 12px;font-weight:700;margin-bottom:12px}
body:not(.in){overflow:hidden}
body:not(.in) header,body:not(.in) #tkw,body:not(.in) #m,body:not(.in) #pl,body:not(.in) #wg{display:none}
#gate{position:fixed;inset:0;z-index:80;overflow:hidden;background:linear-gradient(#b9e2ff 0%,#6eb6f5 42%,#1877F2 78%);color:#fff}
#gate[hidden]{display:none}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.9;animation:drift 36s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:46%;height:140%;left:12%;top:-70%}
.cloud:after{width:38%;height:120%;right:14%;top:-50%}
.c1{width:140px;height:42px;top:18%;left:-20%;animation-duration:42s}
.c2{width:90px;height:28px;top:8%;left:-10%;animation-duration:28s;animation-delay:-8s}
.c3{width:180px;height:48px;top:30%;left:-30%;animation-duration:54s;animation-delay:-20s}
@keyframes drift{to{transform:translateX(140vw)}}
.gate-title{position:absolute;top:28px;left:28px;margin:0;z-index:3;font:800 clamp(52px,9vw,96px)/.95 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:-1px;text-shadow:0 10px 0 rgba(11,79,179,.35),0 18px 28px rgba(0,0,0,.2);animation:floaty 4.6s ease-in-out infinite}
.gate-desc{position:absolute;top:calc(36px + clamp(56px,9vw,100px));left:32px;z-index:3;max-width:34rem;margin:0;font-size:clamp(16px,2.2vw,20px);font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.25)}
@keyframes floaty{50%{transform:translateY(-12px)}}
.road{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#5c6168,#3a3d42 18%)}
.verge{position:absolute;left:0;right:0;top:0;height:14px;background:#6b8f4e}
.lane{position:absolute;left:-50%;right:-50%;top:46%;height:8px;background:repeating-linear-gradient(90deg,#F7B928 0 48px,transparent 48px 96px);animation:lane .8s linear infinite}
@keyframes lane{to{transform:translateX(-96px)}}
.truck{position:absolute;bottom:18px;width:min(420px,78vw);height:auto;animation:drive 13s linear infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.18))}
@keyframes drive{from{left:-45%}to{left:110%}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.1s ease-out infinite}
@keyframes puff{to{transform:translate(-16px,-18px) scale(1.6);opacity:0}}
.gate-box{position:absolute;left:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;width:min(280px,calc(100% - 40px));background:#fff;color:var(--tx);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.gate-box label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#050505}
.gate-box input{min-height:44px;border:1px solid #CED0D4;border-radius:8px;padding:8px 10px;font:16px/1.2 system-ui,sans-serif;background:#F0F2F5;color:#050505}
.gate-box .btn,.gate-box .btn.g{min-height:44px;text-align:center}
.gate-box .btn.g{background:#E4E6EB;color:#050505}
#he{min-height:1.2em;margin:0}
@media(max-width:640px){.gate-title{left:16px;top:16px;font-size:clamp(40px,12vw,64px)}.gate-desc{left:16px;right:16px;top:calc(20px + clamp(44px,12vw,72px));font-size:16px}}
</style></head><body>
<section id="gate" aria-label="GoRoadHub home">
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<h1 class="gate-title">GoRoadHub</h1>
<p class="gate-desc">One place for Australian truck drivers: groups, road news, and the podcast.</p>
<div class="road"><div class="verge"></div><div class="lane"></div>
<svg class="truck" viewBox="0 0 360 150" role="img" aria-label="Cartoon truck driving past">
<ellipse class="puff" cx="18" cy="78" rx="8" ry="6" fill="#fff" opacity=".7"/>
<rect x="36" y="36" width="168" height="72" rx="10" fill="#fff"/>
<rect x="48" y="48" width="144" height="34" rx="6" fill="#1877F2"/>
<text x="120" y="72" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="24" font-weight="700">G</text>
<path d="M204 58h62l46 28v22H204z" fill="#0b4fb3"/>
<path d="M214 64h42l28 18H214z" fill="#E7F3FF"/>
<rect x="312" y="96" width="22" height="10" rx="2" fill="#222"/>
<circle cx="328" cy="92" r="5" fill="#F7B928"/>
<g class="wheel"><circle cx="78" cy="114" r="20" fill="#222"/><circle cx="78" cy="114" r="8" fill="#d8dbe0"/><path d="M78 98v32M62 114h32" stroke="#222" stroke-width="2"/></g>
<g class="wheel"><circle cx="168" cy="114" r="20" fill="#222"/><circle cx="168" cy="114" r="8" fill="#d8dbe0"/><path d="M168 98v32M152 114h32" stroke="#222" stroke-width="2"/></g>
<g class="wheel"><circle cx="268" cy="114" r="20" fill="#222"/><circle cx="268" cy="114" r="8" fill="#d8dbe0"/><path d="M268 98v32M252 114h32" stroke="#222" stroke-width="2"/></g>
</svg>
</div>
<form class="gate-box" onsubmit="gateLogin(event)">
<label for="hu">Username<input id="hu" name="username" autocomplete="username" maxlength="40"></label>
<label for="hp">Password<input id="hp" name="password" type="password" autocomplete="current-password"></label>
<button class="btn" type="submit">Log in</button>
<button class="btn g" type="button" onclick="enterHub(false)">Enter without logging in</button>
<p id="he" class="mut" role="status"></p>
</form>
</section>
<header><div class="logo">G</div><span class="brand">GoRoadHub</span><input id="q" placeholder="Search posts, people, topics…" oninput="V.q=this.value;drawList()"><nav id="nav"></nav></header>
<div id="tkw"><b>● LIVE</b><div id="tk"></div></div>
<main id="m"></main>
<div id="pl"></div>
<div id="wg"><h4 onclick="wgT()"><span><i class="dot"></i>Live across groups</span><span id="wgx">–</span></h4><div id="wgb" onclick="wgGo()"></div></div>
<script src="/quarter.js"></script><script src="/app.js"></script></body></html>
