<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Driver's Advocate</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#001D3D">
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:400 700;font-display:swap;src:url("/fonts/figtree-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:800;font-display:swap;src:url("/fonts/saira-condensed-800-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#001428;--card:#001D3D;--tx:#F7F8FA;--mut:#B7C4D4;--bl:#C80813;--link:#FFD6D3;--bl2:#3A1218;--bd:#1E3A5C;--hov:#0A2C52;--navy:#001D3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:3px solid var(--bl);display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;display:block;background:var(--navy)}
.brand{font-weight:800;color:#fff;font-size:16px;letter-spacing:.01em;line-height:1.1}

header input::placeholder{color:#8EA0B5}

nav button{border:0;background:none;color:var(--mut);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{background:var(--hov)}nav button.on{color:#fff;border-bottom-color:var(--bl);border-radius:8px 8px 0 0}
#tkw{background:var(--navy);color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;display:flex;border-top:2px solid #fff}
#tkw b{background:var(--bl);padding:6px 12px;z-index:2;flex:none}
#tk{display:inline-block;padding:6px 0;animation:mq 140s linear infinite}#tkw:hover #tk{animation-play-state:paused}
#tk span{margin:0 28px}#tk i{opacity:.75;font-style:normal;font-weight:700;margin-right:6px}#tk i.rm{background:#fff;color:#E41E3F;opacity:1;font-weight:800;border-radius:10px;padding:1px 9px}

@media(min-width:900px){main.two{grid-template-columns:minmax(0,1fr) 290px}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex:none;border:0;background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tab.on{background:var(--bl);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,textarea,input.f{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font:inherit}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--bl2);color:#fff;border-color:var(--bl);font-weight:600}
.post .top{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;flex:none;color:#fff;font-weight:700;display:grid;place-items:center}
.nm{font-weight:600}.sub{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--bl2);color:var(--link);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;margin-top:6px}
.acts{display:flex;border-top:1px solid var(--bd);margin-top:10px;padding-top:4px}
.acts button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px}
.acts button:hover{background:var(--hov)}.acts button.on{color:var(--link)}
.btn{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.g{background:var(--bg);color:var(--tx)}
.lk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lk:last-child{border:0}.lk input{flex:1;min-width:140px}
.star{cursor:pointer;font-size:20px;background:none;border:0;color:var(--mut)}.star.on{color:#F7B928}
.fl{color:var(--link);background:none;border:0;cursor:pointer;font-weight:600;font-size:13px;padding:0 0 0 6px}
#wg{display:none}
#wg h4{margin:0;background:var(--bl);color:#fff;padding:7px 12px;font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
#wgb{padding:10px 12px;cursor:pointer;font-size:13px;transition:opacity .3s}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C80813;margin-right:6px;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.3}}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:700 9px/1 system-ui,sans-serif;vertical-align:middle;margin-right:5px;flex:none;position:relative}.ico.fb{font:700 14px/1 Georgia,serif}.ico.main{font-size:8px}#tk .ico{border:1.5px solid #fff;margin-right:6px}.ico.logo{background:#fff;color:#111;overflow:hidden}.ico.logo img{position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);object-fit:contain}
.mag{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-flow:dense;gap:12px}.tile{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.2);display:flex;flex-direction:column;text-align:left;border:0;font:inherit;color:inherit;padding:0;width:100%}.tile.big{grid-column:span 2;grid-row:span 2}.tile .ph{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}.tile.big .ph{aspect-ratio:auto;flex:1;min-height:220px}.tile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.pi{color:#fff;font:800 34px system-ui;opacity:.85}.tb{padding:10px 12px 12px}.ht{font-weight:700;font-size:16px;line-height:1.25;margin-top:4px}.tile.big .ht{font-size:22px}@media(max-width:560px){.tile.big{grid-column:span 1;grid-row:span 1}}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;gap:6px;align-items:center;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}#pl .pt{flex:1;min-width:0}#pl .pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pl input{width:100%}#pl button{border:0;background:var(--bg);color:var(--tx);border-radius:10px;min-width:54px;height:54px;font-size:15px;font-weight:700;cursor:pointer}#pl button.pp{background:var(--bl);color:#fff;min-width:64px;font-size:22px}nav{overflow-x:auto;max-width:100%}
.note{background:var(--bl2);border-left:4px solid var(--bl);padding:10px 12px;border-radius:4px;font-size:13.5px;margin:8px 0}
h3{margin:0 0 8px}.mut{color:var(--mut)}
.opt{border:2px solid var(--bd);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}.opt.on{border-color:var(--bl);background:var(--bl2)}
@media(max-width:600px){nav button{padding:8px 8px;font-size:12px}.brand{font-size:13px}}
.btn,.acts button,nav button,.chip{min-height:44px}
.replies{margin-top:8px}
.cab-btn{width:100%;min-height:64px;font-size:18px;margin-top:10px}
.story-hit{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-top:1px solid var(--bd);padding:16px 14px;cursor:pointer;min-height:76px;font:inherit}
.story-hit b{display:block;font-size:18px;line-height:1.35;margin-top:4px}
.area-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.area-row h3{margin:0}
.area-pick{display:flex;flex-direction:column;gap:4px;min-width:min(100%,280px);font-size:13px;font-weight:700;color:var(--mut)}
.area-pick select{min-height:44px;width:100%}
.page-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.page-link{display:flex;align-items:center;min-height:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:#001428;color:#F7F8FA;font-weight:700;font-size:14px;line-height:1.25;text-decoration:none}
@media(max-width:600px){.page-cols{gap:6px}.page-link{min-height:44px;padding:8px;font-size:13px}}
.src-row{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 4px}
.src-logo{width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid var(--bd);display:grid;place-items:center;overflow:hidden}
.src-logo img{width:22px;height:22px;object-fit:contain}
.traffic-row{padding:14px 0;border-top:1px solid var(--bd)}
.traffic-row .ht{display:block;font-size:18px;line-height:1.35;margin:4px 0}
.traffic-row p{margin:0 0 8px;color:var(--mut)}
.traffic-row a{color:var(--link);font-weight:700;text-decoration:none}
.offbar{background:#E41E3F;color:#fff;border-radius:8px;padding:10px 12px;font-weight:700;margin-bottom:12px}
body:not(.in){overflow:hidden}
body:not(.in) header,body:not(.in) #tkw,body:not(.in) #m,body:not(.in) #pl,body:not(.in) #wg{display:none}
#gate{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:flex-start;padding-left:clamp(48px,5vw,72px);overflow:hidden;background:#001D3D;color:#fff;isolation:isolate;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
#gate[hidden]{display:none}
.gate-hero{position:absolute;inset:0;z-index:0;background:#001D3D url("/brand/trucking-news.png") right center / cover no-repeat}
.gate-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#001D3D 0%,#001D3D 36%,rgba(0,29,61,.92) 48%,rgba(0,29,61,.45) 68%,rgba(0,29,61,.2) 100%)}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.gate-stack{position:relative;z-index:3;width:min(440px,calc(100vw - 48px));animation:gate-in .7s ease both}
@keyframes gate-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.gate-brand{position:relative;z-index:1;margin:0 0 10px;font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(2.8rem,7vw,4.2rem);line-height:.9;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.gate-brand span span{color:#C80813}
.gate-rule{position:relative;z-index:1;width:4.6rem;height:5px;margin:12px 0 0;border-radius:999px;background:#C80813;box-shadow:0 2px 0 #fff}
.gate-head{position:relative;z-index:1;margin:18px 0 10px;font-weight:700;font-size:clamp(1.25rem,2.6vw,1.55rem);line-height:1.25;max-width:24ch}
.gate-sub{position:relative;z-index:1;margin:0 0 8px;color:#D5DEE8;font-size:1rem;max-width:38ch}
.gate-tabs{position:relative;z-index:1;display:flex;gap:18px;margin:0 0 12px}
.gate-tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:6px 0 8px;color:#B7C4D4;font:600 15px/1 "Figtree",system-ui,sans-serif;cursor:pointer}
.gate-tabs button.on{color:#fff;border-bottom-color:#C80813}
.gate-box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:min(360px,100%);background:transparent;color:inherit;padding:0;box-shadow:none}
.gate-box[hidden]{display:none}
.gate-box label{display:flex;flex-direction:column;gap:5px;width:100%;font-size:.82rem;font-weight:500;color:#D5DEE8}
.gate-box input{min-height:44px;width:100%;border:1px solid #1E3A5C;border-radius:10px;padding:11px 12px;font:inherit;font-size:1rem;color:#fff;background:#001428}
.gate-box input::placeholder{color:#8EA0B5}
.gate-box input:focus{outline:none;border-color:#C80813;box-shadow:0 0 0 3px rgba(200,8,19,.35)}
.gate-acts{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:4px}
.gate-box .btn,.gate-box .btn.g{width:auto;min-height:42px;border-radius:10px;padding:10px 16px;font-family:inherit;font-size:15px;font-weight:700;text-align:center}
.gate-box .btn{background:#C80813;color:#fff}
.gate-box .btn.g{background:transparent;color:#fff;border:1px solid #fff}
.gate-note{position:relative;z-index:1;margin:0 0 14px;max-width:40ch;color:#D5DEE8;font-size:.86rem;line-height:1.4}
#he,#je{min-height:1.1em;margin:0;color:#FFD6D3;font-size:13px}
@media(max-width:720px){#gate{overflow:auto;align-items:flex-start;justify-content:flex-start;padding:28px 20px 40px}.gate-stack{width:100%}.gate-scrim{background:linear-gradient(180deg,rgba(0,29,61,.45) 0%,#001D3D 42%,#001D3D 100%)}}
</style></head><body>
<section id="gate" aria-label="The Driver's Advocate home">
<div class="gate-hero"></div>
<div class="gate-scrim"></div>
<div class="gate-stack">
<h1 class="gate-brand"><span class="vh">The Driver's Advocate</span><span aria-hidden="true">The Driver's<br><span>Advocate</span></span></h1>
<div class="gate-rule"></div>
<p class="gate-head">Daily driving news.</p>
<p class="gate-sub">Promoting truck driving in Australia and New Zealand.</p>
<p class="gate-note">The site stays open without a password.</p>
<div class="gate-tabs" role="tablist" aria-label="Account">
<button type="button" id="gt-in" class="on" role="tab" aria-selected="true" aria-controls="gate-in" onclick="gateTab('in')">Log in</button>
<button type="button" id="gt-new" role="tab" aria-selected="false" aria-controls="gate-new" onclick="gateTab('new')">Create an account</button>
</div>
<form class="gate-box" id="gate-in" onsubmit="gateLogin(event)">
<label for="hu">Username<input id="hu" name="username" autocomplete="username" maxlength="40" placeholder="Your name"></label>
<label for="hp">Password<input id="hp" name="password" type="password" autocomplete="current-password" placeholder="Password"></label>
<div class="gate-acts">
<button class="btn" type="submit">Log in</button>
<button class="btn g" type="button" onclick="enterHub(false)">Enter without logging in</button>
</div>
<p id="he" role="status"></p>
</form>
<form class="gate-box" id="gate-new" hidden onsubmit="gateJoin(event)">
<label for="ju">Username<input id="ju" name="username" autocomplete="username" maxlength="40" placeholder="Your name"></label>
<label for="jp">Password<input id="jp" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="At least 8 characters"></label>
<div class="gate-acts">
<button class="btn" type="submit">Create account</button>
<button class="btn g" type="button" onclick="enterHub(false)">Enter without logging in</button>
</div>
<p id="je" role="status"></p>
</form>
</div>
</section>
<header><img class="logo" src="/icon.svg" alt=""><span class="brand">The Driver's <b>Advocate</b></span><input id="q" placeholder="Search news…" oninput="V.q=this.value;if(V.view=='mag')drawMag()"><nav id="nav"></nav></header>
<div id="tkw"><b>● LIVE</b><div id="tk"></div></div>
<main id="m"></main>
<div id="pl"></div>
<script src="/areas.js"></script><script src="/quarter.js"></script><script src="/app.js"></script></body></html>
