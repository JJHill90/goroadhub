<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GoRoadHub – Driver Groups in One Place</title>
<style>
:root{--bg:#F0F2F5;--card:#fff;--tx:#050505;--mut:#65676B;--bl:#1877F2;--bl2:#E7F3FF;--bd:#CED0D4;--hov:#F2F2F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#18191A;--card:#242526;--tx:#E4E6EB;--mut:#B0B3B8;--bl:#2D88FF;--bl2:#263951;--bd:#3E4042;--hov:#3A3B3C}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:50%;background:var(--bl);color:#fff;font:700 24px/40px Georgia,serif;text-align:center}
.brand{font-weight:800;color:var(--bl);font-size:20px}
header input{flex:1;min-width:120px;max-width:300px;border:0;background:var(--bg);color:var(--tx);border-radius:20px;padding:9px 14px;font-size:15px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:none;color:var(--mut);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{background:var(--hov)}nav button.on{color:var(--bl);border-bottom-color:var(--bl);border-radius:8px 8px 0 0}
#tkw{background:var(--bl);color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;display:flex}
#tkw b{background:#0b4fb3;padding:6px 12px;z-index:2;flex:none}
#tk{display:inline-block;padding:6px 0;animation:mq 70s linear infinite}#tkw:hover #tk{animation-play-state:paused}
#tk span{margin:0 28px}#tk i{opacity:.75;font-style:normal;font-weight:700;margin-right:6px}#tk i.rm{background:#fff;color:#E41E3F;opacity:1;font-weight:800;border-radius:10px;padding:1px 9px}

.card{background:var(--card);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.15);padding:12px 14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex:none;border:0;background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tab.on{background:var(--bl);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,textarea,input.f{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font:inherit}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--bl2);color:var(--bl);border-color:var(--bl);font-weight:600}
.post .top{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;flex:none;color:#fff;font-weight:700;display:grid;place-items:center}
.nm{font-weight:600}.sub{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--bl2);color:var(--bl);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;margin-top:6px}
.acts{display:flex;border-top:1px solid var(--bd);margin-top:10px;padding-top:4px}
.acts button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px}
.acts button:hover{background:var(--hov)}.acts button.on{color:var(--bl)}
.btn{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.g{background:var(--bg);color:var(--tx)}
.lk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lk:last-child{border:0}.lk input{flex:1;min-width:140px}
.star{cursor:pointer;font-size:20px;background:none;border:0;color:var(--mut)}.star.on{color:#F7B928}
.fl{color:var(--bl);background:none;border:0;cursor:pointer;font-weight:600;font-size:13px;padding:0 0 0 6px}
#wg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:290px;max-width:calc(100vw - 24px);z-index:30;background:var(--card);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.3);overflow:hidden;border:1px solid var(--bd)}
#wg h4{margin:0;background:var(--bl);color:#fff;padding:7px 12px;font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
#wgb{padding:10px 12px;cursor:pointer;font-size:13px;transition:opacity .3s}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#31A24C;margin-right:6px;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.3}}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font:700 9px/1 system-ui,sans-serif;vertical-align:middle;margin-right:5px;flex:none}.ico.fb{font:700 14px/1 Georgia,serif}.ico.main{font-size:8px}#tk .ico{border:1.5px solid #fff;margin-right:6px}
.note{background:var(--bl2);border-left:4px solid var(--bl);padding:10px 12px;border-radius:4px;font-size:13.5px;margin:8px 0}
h3{margin:0 0 8px}.mut{color:var(--mut)}
.opt{border:2px solid var(--bd);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}.opt.on{border-color:var(--bl);background:var(--bl2)}
@media(max-width:600px){nav button{padding:8px 8px;font-size:12px}.brand{display:none}}
</style></head><body>
<header><div class="logo">G</div><span class="brand">GoRoadHub</span><input id="q" placeholder="Search posts, people, topics…" oninput="V.q=this.value;drawList()"><nav id="nav"></nav></header>
<div id="tkw"><b>● LIVE</b><div id="tk"></div></div>
<main id="m"></main>
<div id="wg"><h4 onclick="wgT()"><span><i class="dot"></i>Live across groups</span><span id="wgx">–</span></h4><div id="wgb" onclick="wgGo()"></div></div>
<script>
const $=s=>document.querySelector(s),B='https://www.facebook.com/groups/';
const slugs=['thedriversadvocate','1063426956322044','1793368841975193','1036518402724413','1599997731918811','ontheroaddashcam','broletssharetheroad','1615671469942614','977148505415763','1109200424783750','1792433288617560','1064792576427449','2173765266827526','1625137029323808','28261322453539247','969273342879706'];
const known={0:'The Drivers Advocate',5:'On The Road Dashcam',6:'Brolets Share The Road'};
const G=slugs.map((s,i)=>({id:i,url:B+s,name:known[i]||'Group '+(i+1)}));
const TOP=['Dashcam','Road Rules','Safety','Fines & Law','Roadworks','Cyclists & Sharing','Q&A'];
const TPL={Dashcam:['Caught this near-miss on my dashcam this morning. Who was at fault?','Footage of a driver running a red light. Sharing for awareness.'],'Road Rules':['Quick refresher: who has right of way when exiting a roundabout?','Is a phone mounted on the dash for navigation legal?'],Safety:['Reminder to check tyre pressure before long trips.','Wet weather tip: leave at least a 4 second following gap.'],'Fines & Law':['Has anyone successfully contested a speed camera fine? What worked?','Demerit point changes are coming. Here is what to know.'],Roadworks:['Heads up: lane closures on the main arterial this week.','New speed limit signs went up at the bridge works.'],'Cyclists & Sharing':['Passing cyclists: leave a metre. Clip shows exactly why.','Cyclist here. Thanks to the driver who waited patiently today.'],'Q&A':['Which dashcam do you recommend under $150?','How long should I keep footage after an incident?']};
const AU=['Sam Porter','Jess Nguyen','Mick O\'Brien','Priya Shah','Dave Collins','Tara Lee','Rob Hughes','Mia Santos','Chris Walker','Ellie Grant','Tom Baker','Ana Silva'];
let sd=7;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
const P=Array.from({length:56},(_,i)=>{const t=TOP[Math.floor(rnd()*7)];return{id:i,g:Math.floor(rnd()*16),a:AU[Math.floor(rnd()*12)],t,x:TPL[t][Math.floor(rnd()*2)],m:Math.floor(rnd()*rnd()*60*24*30)+5,l:Math.floor(rnd()*rnd()*320),c:Math.floor(rnd()*rnd()*70)}});
const NEWS=[['NEWS','Road toll figures released for the quarter','news','Sample News'],['TRENDING','Dashcam footage legal in court? Latest ruling explained','news','Sample Legal Desk'],['NEWS','Major roadworks begin on key motorway corridor','web','Sample Roads Authority'],['POST','Hot topic: roundabout etiquette debate heats up','fb','On The Road Dashcam'],['NEWS','New safe-passing distance enforcement blitz announced','news','Sample News'],['TRENDING','Mobile phone detection cameras: what drivers should know','main','The Drivers Advocate'],['POST','Most-liked clip this week: near-miss at school crossing','fb','Brolets Share The Road'],['NEWS','Fuel price and rego changes: what is changing','news','Sample Transport Gazette']];
let DB=null,PS=null,TK=null,ADMIN=false,ED=null,CF=null;const base=()=>PS||P;
let S={fav:[],fol:[],lk:[],aff:{},nm:{},mode:'own',mine:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('rh')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('rh',JSON.stringify(S))}catch(e){}};
let V={view:'feed',tab:'all',date:'all',topics:[],sort:'fy',q:'',src:'all'};
const gn=g=>S.nm[g.id]||g.name,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=m=>m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d';
const col=n=>'hsl('+([...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360)+',55%,45%)';
const all=()=>[...S.mine,...base()];
function score(p){const h=p.m/60;let s=Math.log(1+p.l)+.5*Math.log(1+p.c)+2.5*Math.exp(-h/48);s+=1.2*(S.aff[p.t]||0);if(S.fav.includes(p.g))s+=1.5;if(S.fol.includes(p.a))s+=2;return s}
function list(){const lim={today:1440,week:10080,month:43200,all:1e9}[V.date],q=V.q.toLowerCase();
let r=all().filter(p=>p.m<=lim&&(V.tab=='all'||(V.tab=='fav'?S.fav.includes(p.g)||S.fol.includes(p.a):V.tab=='news'?['news','web'].includes(sinfo(p).s):p.g==V.tab))&&(V.src=='all'||sinfo(p).s==V.src)&&(!V.topics.length||V.topics.includes(p.t))&&(!q||(p.x+p.a+p.t+gn(gOf(p))+sinfo(p).n).toLowerCase().includes(q)));
const f=V.sort=='fy'?(a,b)=>score(b)-score(a):V.sort=='new'?(a,b)=>a.m-b.m:V.sort=='cur'?(a,b)=>(b.ord||0)-(a.ord||0):(a,b)=>(b.l+b.c)-(a.l+a.c);return r.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||f(a,b))}
function card(p){const g=gOf(p),si=sinfo(p),on=S.lk.includes(String(p.id)),f=S.fol.includes(p.a);return`<div class="card post"><div class="top"><div class="av" style="background:${col(p.a)}">${esc(p.a[0])}</div><div><div class="nm">${esc(p.a)}${p.a=='You'?'':`<button class="fl" onclick="fol('${esc(p.a).replace(/'/g,"\\'")}')">${f?'✓ Following':'+ Follow'}</button>`}</div><div class="sub">${p.pin?'📌 Pinned · ':''}${ico(si.s,si.n)}<b>${esc(si.n)}</b>${si.s=='fb'||si.s=='main'||p.g<0?'':' · '+esc(gn(g))} · ${p.m<2?'just now':ago(p.m)}${p.d?' · <b>Draft, not yet on Facebook</b>':''}</div></div></div><p>${esc(p.x)}</p><span class="tag">${p.t}</span><div class="sub" style="margin-top:6px">👍 ${p.l+(on?1:0)} · ${p.c} comments</div><div class="acts"><button class="${on?'on':''}" onclick="like('${p.id}')">👍 Like</button><a style="flex:1;display:flex" href="${p.url||g.url||'#'}" target="_blank" rel="noopener"><button style="flex:1">${si.s=='news'||si.s=='web'?'🔗 Open source':'💬 Open in Facebook'}</button></a><button onclick="cp('${p.url||g.url}')">↗ Copy link</button></div></div>`}
function drawList(){const e=$('#list');if(!e)return;const r=list();e.innerHTML=r.length?r.map(card).join(''):'<div class="card mut">No posts match these filters.</div>'}
function nav(){$('#nav').innerHTML=[['feed','🏠 Feed'],['links','🔗 Links'],['post','✏️ Post'],['rem','🔔 Reminders'+(rems().length?' <b style="color:#E41E3F">●</b>':'')],...(ADMIN?[['adm','🛠 Admin']]:[['login','🔐 Admin login']]),['set','⚙️ Settings']].map(([k,l])=>`<button class="${V.view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
const go=v=>{V.view=v;render()};
function render(){nav();const m=$('#m');m.className=V.view=='feed'?'two':'';
if(V.view=='feed'){const tabs=[['all','All groups'],['fav','★ Favourites'],['news','📰 News & sources'],...G.map(g=>[g.id,gn(g)])];
m.innerHTML=`<div><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${V.tab==k?'on':''}" onclick="V.tab='${k}';render()">${esc(l)}</button>`).join('')}</div>
<div class="card"><div class="bar"><b>Sort</b><select onchange="V.sort=this.value;drawList()"><option value="fy" ${V.sort=='fy'?'selected':''}>✨ For You (my algorithm)</option><option value="new" ${V.sort=='new'?'selected':''}>Latest</option><option value="top" ${V.sort=='top'?'selected':''}>Most engaged</option><option value="cur" ${V.sort=='cur'?'selected':''}>📌 Curated (admin order)</option></select><b>Date</b><select onchange="V.date=this.value;drawList()">${[['all','Any time'],['today','Today'],['week','Past week'],['month','Past month']].map(([k,l])=>`<option value="${k}" ${V.date==k?'selected':''}>${l}</option>`).join('')}</select><b>Source</b><select onchange="V.src=this.value;drawList()">${[['all','All sources'],['fb','Facebook groups'],['main','Drivers Advocate main page'],['news','News articles'],['web','Websites']].map(([k,l])=>`<option value="${k}" ${V.src==k?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="bar" style="margin-top:8px">${TOP.map(t=>`<span class="chip ${V.topics.includes(t)?'on':''}" onclick="tp('${t}')">${t}</span>`).join('')}</div>
${V.tab!='all'&&V.tab!='fav'&&V.tab!='news'?`<div class="bar" style="margin-top:8px"><button class="star ${S.fav.includes(+V.tab)?'on':''}" onclick="fv(${V.tab})">★</button><a class="btn" href="${G[V.tab].url}" target="_blank" rel="noopener">Open ${esc(gn(G[V.tab]))} on Facebook</a></div>`:''}</div>
<div id="list"></div></div>
<aside><div class="card"><h3>★ Favourite groups</h3>${S.fav.length?S.fav.map(i=>`<div class="lk"><a style="cursor:pointer;color:var(--bl)" onclick="V.tab=${i};render()">${esc(gn(G[i]))}</a></div>`).join(''):'<span class="mut">Star a group to pin it here.</span>'}</div>
<div class="card"><h3>👥 Following</h3>${S.fol.length?S.fol.map(a=>`<div class="lk">${esc(a)}<button class="fl" onclick="fol('${a.replace(/'/g,"\\'")}')">Unfollow</button></div>`).join(''):'<span class="mut">Follow people from any post.</span>'}</div>
<div class="card"><h3>Source key</h3>${Object.keys(SRC).map(k=>`<div class="lk" style="padding:6px 0">${ico(k,'')}${SRC[k][2]}</div>`).join('')}<div class="sub">News and website icons show the outlet's initials.</div></div>
<div class="card"><h3>🔥 Your top topics</h3>${Object.entries(S.aff).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>`<span class="chip on">${e[0]}</span> `).join('')||'<span class="mut">Like posts to teach your For You feed.</span>'}</div></aside>`;drawList()}
else if(V.view=='links'){m.innerHTML=`<div class="card"><h3>Group links</h3><div class="mut" style="margin-bottom:6px">Rename groups so they match the real names (saved on this device).</div>${G.map(g=>`<div class="lk"><button class="star ${S.fav.includes(g.id)?'on':''}" onclick="fv(${g.id})">★</button><input class="f" value="${esc(gn(g))}" onchange="S.nm[${g.id}]=this.value;sv();render()"><a class="btn" href="${g.url}" target="_blank" rel="noopener">Go to group</a></div>`).join('')}</div>`}
else if(V.view=='post'){m.innerHTML=`<div class="card"><h3>Create a post</h3><div class="note">Facebook does not let third-party apps publish into groups. GoRoadHub copies your text, saves a draft in your feed, and opens the group so you paste and hit Post.</div>
<div class="bar" id="pg">${G.map(g=>`<span class="chip" data-g="${g.id}" onclick="this.classList.toggle('on')">${esc(gn(g))}</span>`).join('')}</div>
<div class="bar" style="margin:10px 0"><select id="pt">${TOP.map(t=>`<option>${t}</option>`).join('')}</select></div>
<textarea id="px" rows="5" style="width:100%" placeholder="What's on your mind?"></textarea>
<div style="margin-top:10px"><button class="btn" onclick="pub()">Copy &amp; prepare</button></div><div id="pr"></div></div>`}
else if(V.view=='rem'){remView()}
else if(V.view=='login'&&!ADMIN){m.innerHTML='<div class="card"><h3>🔐 Admin login</h3><input class="f" id="lp" type="password" placeholder="Admin password" onkeydown="if(event.key==\'Enter\')doLogin()"> <button class="btn" onclick="doLogin()">Log in</button><span id="le" class="mut"></span></div>'}
else if(V.view=='adm'&&ADMIN){admView()}
else{m.innerHTML=`<div class="card"><h3>Login approach</h3>
<div class="opt ${S.mode=='own'?'on':''}" onclick="S.mode='own';sv();render()"><b>Each user connects their own Facebook (recommended)</b><div class="sub">Facebook's own login. Private groups only show what that person is already allowed to see.</div></div>
<div class="opt ${S.mode=='uni'?'on':''}" onclick="S.mode='uni';sv();render()"><b>Universal login to all groups</b><div class="sub">Not possible: no single login unlocks private groups, and automated access breaks Facebook's terms.</div></div>
${S.mode=='uni'?'<div class="note">There is no workable way to auto-enter private groups with one shared login. Option 1 is the only compliant route.</div>':''}</div>
<div class="card"><h3>Before this goes live</h3><div class="note">Until an admin adds posts you see <b>sample data</b>. Facebook retired its Groups API, so posts and ticker headlines are added by hand in the Admin tab (admins only).</div>
<button class="btn g" onclick="localStorage.removeItem('rh');location.reload()">Reset my favourites &amp; algorithm</button></div>`}}
function tp(t){V.topics=V.topics.includes(t)?V.topics.filter(x=>x!=t):[...V.topics,t];render()}
function fv(i){S.fav=S.fav.includes(i)?S.fav.filter(x=>x!=i):[...S.fav,i];sv();render()}
function fol(a){S.fol=S.fol.includes(a)?S.fol.filter(x=>x!=a):[...S.fol,a];sv();render()}
function like(id){id=String(id);const p=all().find(x=>String(x.id)==id),on=S.lk.includes(id);S.lk=on?S.lk.filter(x=>x!=id):[...S.lk,id];S.aff[p.t]=(S.aff[p.t]||0)+(on?-1:1);sv();render()}
function cp(t){try{navigator.clipboard.writeText(t)}catch(e){}}
function pub(){const gs=[...document.querySelectorAll('#pg .chip.on')].map(e=>+e.dataset.g),x=$('#px').value.trim(),t=$('#pt').value;if(!gs.length||!x){$('#pr').innerHTML='<div class="note">Pick at least one group and write something.</div>';return}
cp(x);gs.forEach(g=>S.mine.unshift({id:'u'+Date.now()+g,g,a:'You',t,x,m:0,l:0,c:0,d:1}));sv();
$('#pr').innerHTML='<div class="note">Text copied. Open each group, paste, and post:</div>'+gs.map(g=>`<a class="btn" style="margin:4px 4px 0 0" href="${G[g].url}" target="_blank" rel="noopener">Open ${esc(gn(G[g]))}</a>`).join('')}
// ticker
function drawTk(){const L=TK&&TK.length?TK.map(t=>[t.kind||'NEWS',t.text,t.src||'news',t.srcName||'']):NEWS;const A=[...rems().map(x=>['REMINDER',x.t]),...L];$('#tk').innerHTML=[...A,...A].map(n=>n[0]=='REMINDER'?`<span><i class="rm">Reminder</i>${esc(n[1])}</span>`:`<span>${ico(n[2]||'news',n[3])}<i>${esc(n[0])}</i>${esc(n[1])}</span>`).join('');if(V.view=='adm')drawAdmin()}
// roaming widget
let wi=0,wo=true,wl=[];
function wgTick(){if(!wo)return;wl=[...base()].sort((a,b)=>a.m-b.m).slice(0,10);if(!wl.length)return;const p=wl[wi++%wl.length],b=$('#wgb');b.style.opacity=0;setTimeout(()=>{const si=sinfo(p);b.dataset.g=(p.g>=0&&si.s!='news'&&si.s!='web')?p.g:'news';b.innerHTML=`${ico(si.s,si.n)}<b>${esc(si.n)}</b><br><span class="mut">${esc(p.a)} · ${ago(p.m)}</span><br>${esc(p.x)}`;b.style.opacity=1},250)}
function wgT(){wo=!wo;$('#wgb').style.display=wo?'':'none';$('#wgx').textContent=wo?'–':'+';wgTick()}
function wgGo(){const g=$('#wgb').dataset.g;if(g!=null){V={...V,view:'feed',tab:isNaN(g)?g:+g};render()}}
const SRC={fb:['f','#1877F2','Facebook group'],main:['DA','#0B4FB3','Drivers Advocate main page'],news:['📰','#6B7280','News article'],web:['🌐','#0E9F6E','Website']};
const gOf=p=>G[p.g]||{id:-1,name:'General / news',url:''};
const sOpts=s=>Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${k==s?'selected':''}>${v[2]}</option>`).join('');
function sinfo(p){const s=p.src||(p.g==0?'main':'fb');let n=p.srcName;if(!n)n=s=='fb'?gn(gOf(p)):s=='main'?'The Drivers Advocate':SRC[s][2];return{s,n}}
function ico(s,n){const d=SRC[s]||SRC.web,nw=(s=='news'||s=='web'),w=(n||'').trim().split(/\s+/).filter(Boolean),has=nw&&w.length,t=has?(w[0][0]+(w[1]?w[1][0]:'')).toUpperCase():d[0];return`<span class="ico ${s}" style="background:${has?col(n):d[1]}" title="${esc(d[2]+(n?': '+n:''))}">${esc(t)}</span>`}
// ---- procedural reminders (stored per viewer on this device)
const HEALTH=['Blood pressure check','Vision & eye check-in','Hearing check-in','Sleep & fatigue review','Weight & waist check','Blood sugar screening (if advised)','Back, joints & posture check','Mental health & stress check-in'];
const EQ={'Compliance & paperwork':['Work diary / logbook','Licence & medical certificate','Registration & insurance papers','Load manifests & paperwork','Fuel & toll cards','Vehicle inspection / defect book','Dangerous goods papers (if carried)','Permits & driver ID'],
'Safety & emergency':['Fire extinguisher','First aid kit','Hazard triangles','Hi-vis vest','Safety boots','Work gloves','Torch & spare batteries','Spill kit','Wheel chocks'],
'Truck checks':['Tyres (pressure & tread)','Spare tyre','Tyre pressure gauge','Jack & wheel brace','Engine oil level','Coolant level','Windscreen washer fluid','Wiper blades','Lights & bulbs','Fuses','Battery & terminals','Mirrors','Brakes & air system'],
'Load securement':['Ratchet straps','Chains & load binders','Tarps','Corner protectors','Ropes & bungees','Dunnage / load bars','Coupling & landing legs'],
'Electronics':['Dashcam','GPS / navigation','UHF radio','Phone mount & charger','Power inverter','Tablet / e-diary','Reversing camera'],
'Cab & comfort':['Mattress & bedding','Seat & cushion','Sunshades & curtains','Ear plugs / headphones','12V fridge / cooler','Cab air filter']};
const ITEMS=[...HEALTH.map(n=>({n,c:'Health check-ins'})),...Object.entries(EQ).flatMap(([c,a])=>a.map(n=>({n,c})))].map((x,i)=>({...x,id:'i'+i}));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const td0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
let R={start:ymd(td0()),done:{},rep:{},notes:{},rec:{},shown:''},RV='chk';
try{Object.assign(R,JSON.parse(localStorage.getItem('rhr')||'{}'))}catch(e){}
const rsv=()=>{try{localStorage.setItem('rhr',JSON.stringify(R))}catch(e){}};rsv();
const qk=(y,q)=>y+'-Q'+q,qEnd=(y,q)=>new Date(y,q*3,0),dn=d=>Math.round((d-td0())/864e5);
const curQ=()=>{const t=td0();return[t.getFullYear(),Math.floor(t.getMonth()/3)+1]};
const pend=k=>ITEMS.filter(i=>!(R.done[k]||{})[i.id]).length;
const inD=d=>d==0?'today':'in '+d+' day'+(d>1?'s':'');
function rems(){const[y,q]=curQ(),k=qk(y,q),d=dn(qEnd(y,q)),o=[],st=new Date(R.start+'T00:00:00'),pq=q==1?[y-1,4]:[y,q-1],pk=qk(pq[0],pq[1]);
if(qEnd(pq[0],pq[1])>=st&&pend(pk)>0)o.push({t:'Overdue: '+pend(pk)+' checks from Q'+pq[1]+' '+pq[0]+' still open'});
if(q==1&&!R.rec[y-1]&&new Date(y-1,11,31)>=st)o.push({t:'Year-end reconciliation for '+(y-1)+' is overdue'});
if(d<=3&&pend(k)>0)o.push({t:'Quarterly checks due '+inD(d)+' ('+pend(k)+' of '+ITEMS.length+' still open)'});
if(q==4&&d<=3&&!R.rec[y])o.push({t:'Year-end reconciliation due '+inD(d)});
return o}
function remView(){const[y,q]=curQ(),k=qk(y,q),e=qEnd(y,q),d=dn(e);
$('#m').innerHTML=`<div class="card"><h3>🔔 Quarterly reminders</h3><div>Q${q} ${y} checks are due <b>${e.toDateString()}</b> (${d==0?'today':'in '+d+' days'}). A popup and a red <b style="color:#E41E3F">Reminder</b> in the top ticker appear 3 days before.</div><div style="margin:8px 0"><b>${ITEMS.length-pend(k)}/${ITEMS.length}</b> done this quarter</div><div class="note">Health items are check-in prompts, not medical advice; follow your doctor's schedule. The item list is a general starter set.</div><div class="bar"><button class="chip ${RV=='chk'?'on':''}" onclick="RV='chk';remView()">This quarter</button><button class="chip ${RV=='yr'?'on':''}" onclick="RV='yr';remView()">Year-end reconciliation</button></div></div><div id="rbody"></div>`;RV=='chk'?drawChk():drawYr()}
function drawChk(){const dd=R.done[qk(...curQ())]||{};
$('#rbody').innerHTML=[...new Set(ITEMS.map(i=>i.c))].map(c=>{const L=ITEMS.filter(i=>i.c==c);return`<div class="card"><h3>${c} <span class="sub">${L.filter(i=>dd[i.id]).length}/${L.length}</span></h3>${L.map(i=>`<div class="lk"><label style="flex:1"><input type="checkbox" ${dd[i.id]?'checked':''} onchange="tg('${i.id}')"> ${esc(i.n)}</label><button class="chip ${R.rep[i.id]?'on':''}" onclick="rp('${i.id}')">${R.rep[i.id]?'⚠ Needs replacing':'Flag to replace'}</button></div>`).join('')}</div>`}).join('')}
function keep(f){const y=scrollY;f();rsv();remView();scrollTo(0,y);nav();drawTk()}
const tg=id=>keep(()=>{const k=qk(...curQ());R.done[k]=R.done[k]||{};R.done[k][id]=!R.done[k][id]});
const rp=id=>keep(()=>{R.rep[id]=!R.rep[id]});
function yrText(y){const fl=ITEMS.filter(i=>R.rep[i.id]).map(i=>'- '+i.n);return'GoRoadHub year-end reconciliation '+y+'\n'+[1,2,3,4].map(q=>'Q'+q+': '+(ITEMS.length-pend(qk(y,q)))+'/'+ITEMS.length+' done').join('\n')+'\nNeeds replacing:\n'+(fl.join('\n')||'- none')+'\nNotes: '+(R.notes[y]||'')}
function drawYr(){const[y]=curQ(),c=(q,i)=>(R.done[qk(y,q)]||{})[i.id]?'✓':'–';
$('#rbody').innerHTML=`<div class="card"><h3>Year-end reconciliation ${y} <span class="sub">due 31 Dec</span></h3><div class="bar">${[1,2,3,4].map(q=>`<span class="chip on">Q${q}: ${ITEMS.length-pend(qk(y,q))}/${ITEMS.length}</span>`).join('')}</div><div style="overflow-x:auto;margin:10px 0"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th align="left">Item</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Replace?</th></tr>${ITEMS.map(i=>`<tr style="border-top:1px solid var(--bd)"><td>${esc(i.n)}</td>${[1,2,3,4].map(q=>`<td align="center">${c(q,i)}</td>`).join('')}<td align="center">${R.rep[i.id]?'⚠':''}</td></tr>`).join('')}</table></div><textarea rows="3" style="width:100%" placeholder="Year-end notes: what failed, what to buy, what to book" onchange="R.notes[${y}]=this.value;rsv()">${esc(R.notes[y]||'')}</textarea><div class="bar" style="margin-top:8px"><button class="btn" onclick="keep(()=>{R.rec[${y}]=!R.rec[${y}]})">${R.rec[y]?'✓ Reconciled (undo)':'Mark year reconciled'}</button><button class="btn g" onclick="cp(yrText(${y}));this.textContent='Copied'">Copy summary</button></div></div>`}
function remPop(){const o=rems(),t=ymd(td0());if(!o.length||R.shown==t)return;R.shown=t;rsv();const e=document.createElement('div');e.id='rp';e.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px';
e.innerHTML=`<div class="card" style="max-width:420px;width:100%"><h3><b style="color:#E41E3F">Reminder</b></h3>${o.map(x=>`<p>• ${esc(x.t)}</p>`).join('')}<div class="bar"><button class="btn" onclick="this.closest('#rp').remove();go('rem')">Open checklist</button><button class="btn g" onclick="this.closest('#rp').remove()">Close</button></div></div>`;document.body.appendChild(e)}
// ---- admin + shared live data
const sorted=()=>[...(PS||[])].sort((a,b)=>(b.ord||0)-(a.ord||0));
const P1=id=>(PS||[]).find(p=>p.id==id);
const er=e=>{const x=$('#ae');if(x)x.textContent=' Failed: '+((e&&e.code)||e)};
const gOpts=s=>'<option value="-1" '+(s==-1?'selected':'')+'>— No group (news / other) —</option>'+G.map(g=>`<option value="${g.id}" ${g.id==s?'selected':''}>${esc(gn(g))}</option>`).join('');
const tOpts=s=>TOP.map(t=>`<option ${t==s?'selected':''}>${t}</option>`).join('');
function refresh(){if(V.view=='feed')drawList();else if(V.view=='adm')drawAdmin();wgTick()}
function admView(){$('#m').innerHTML=`<div class="card"><h3>🛠 Admin: add a post <button class="btn g" onclick="logout()">Log out</button></h3><div class="bar"><select id="ag">${gOpts(0)}</select><select id="at">${tOpts('')}</select><input class="f" id="aa" placeholder="Author name"><select id="as">${sOpts('fb')}</select><input class="f" id="asn" placeholder="Source name (e.g. a news outlet)"><input class="f" id="au" placeholder="Original Facebook post link (optional)"><input class="f" id="ad" type="datetime-local" title="Posted at (blank = now)"><input class="f" id="al" type="number" min="0" placeholder="Likes" style="width:80px"><input class="f" id="ac" type="number" min="0" placeholder="Comments" style="width:100px"></div><textarea id="ax" rows="4" style="width:100%;margin:8px 0" placeholder="Paste the post text"></textarea><button class="btn" onclick="aAdd()">Publish to everyone</button><span id="ae" class="mut"></span></div>
<div class="card"><h3>Posts (curated order, top first)</h3><div id="alist"></div></div>
<div class="card"><h3>Ticker headlines</h3><div class="bar"><select id="tkd"><option>NEWS</option><option>TRENDING</option><option>POST</option></select><select id="tks">${sOpts('news')}</select><input class="f" id="tkn" placeholder="Source name" style="width:140px"><input class="f" id="tx" placeholder="Headline" style="flex:1"><button class="btn" onclick="tAdd()">Add</button></div><div id="tl"></div></div>`;drawAdmin()}
function drawAdmin(){const e=$('#alist');if(!e)return;const L=sorted();
e.innerHTML=L.length?L.map(p=>ED==p.id?`<div class="lk" style="display:block"><div class="bar"><select id="eg">${gOpts(p.g)}</select><select id="et">${tOpts(p.t)}</select><input class="f" id="ea" value="${esc(p.a)}"><select id="es">${sOpts(sinfo(p).s)}</select><input class="f" id="esn" value="${esc(p.srcName||'')}" placeholder="Source name"></div><textarea id="ex" rows="3" style="width:100%;margin:6px 0">${esc(p.x)}</textarea><button class="btn" onclick="aSave('${p.id}')">Save</button> <button class="btn g" onclick="ED=null;drawAdmin()">Cancel</button></div>`:`<div class="lk"><div style="flex:1;min-width:200px"><b>${p.pin?'📌 ':''}${esc(p.a)}</b> <span class="sub">${ico(sinfo(p).s,sinfo(p).n)}${esc(sinfo(p).n)} · ${esc(gn(gOf(p)))} · ${p.t} · ${ago(p.m)}</span><div>${esc(p.x)}</div></div><button class="btn g" onclick="mv('${p.id}',-1)">▲</button><button class="btn g" onclick="mv('${p.id}',1)">▼</button><button class="btn g" onclick="pn('${p.id}')">${p.pin?'Unpin':'Pin'}</button><button class="btn g" onclick="ED='${p.id}';drawAdmin()">Edit</button><button class="btn g" onclick="dl('${p.id}')">${CF==p.id?'Sure?':'Delete'}</button></div>`).join(''):'<div class="mut">No posts yet. <button class="btn g" onclick="aSeed()">Add sample posts</button></div>';
const t=$('#tl');if(t)t.innerHTML=(TK||[]).map(x=>`<div class="lk"><span style="flex:1">${ico(x.src||'news',x.srcName)}<b>${esc(x.kind)}</b> ${esc(x.text)}</span><button class="btn g" onclick="tdl('${x.id}')">Delete</button></div>`).join('')||'<div class="mut">No custom headlines yet (sample ticker shown).</div>'}
async function aAdd(){try{const x=$('#ax').value.trim();if(!x)return;const v=$('#ad').value,at=v?new Date(v).getTime():Date.now();await DB.collection('posts').add({g:+$('#ag').value,a:$('#aa').value.trim()||'Admin',t:$('#at').value,x,url:$('#au').value.trim(),src:$('#as').value,srcName:$('#asn').value.trim(),l:+$('#al').value||0,c:+$('#ac').value||0,pin:false,at,ord:Date.now()});$('#ax').value='';$('#ae').textContent=' Published ✓'}catch(e){er(e)}}
async function pn(id){try{await DB.doc('posts/'+id).update({pin:!P1(id).pin})}catch(e){er(e)}}
async function aSave(id){try{await DB.doc('posts/'+id).update({g:+$('#eg').value,t:$('#et').value,a:$('#ea').value,src:$('#es').value,srcName:$('#esn').value.trim(),x:$('#ex').value});ED=null;drawAdmin()}catch(e){er(e)}}
async function dl(id){if(CF!=id){CF=id;drawAdmin();return}CF=null;try{await DB.doc('posts/'+id).delete()}catch(e){er(e)}}
async function mv(id,d){const L=sorted(),i=L.findIndex(p=>p.id==id),o=x=>(x&&x.ord)||0;let n;if(d<0){if(i<1)return;n=L[i-2]?(o(L[i-2])+o(L[i-1]))/2:o(L[i-1])+1000}else{if(i<0||i>=L.length-1)return;n=L[i+2]?(o(L[i+1])+o(L[i+2]))/2:o(L[i+1])-1000}try{await DB.doc('posts/'+id).update({ord:n})}catch(e){er(e)}}
async function aSeed(){try{for(const p of P.slice(0,24)){const at=Date.now()-p.m*6e4;await DB.collection('posts').add({g:p.g,a:p.a,t:p.t,x:p.x,url:'',l:p.l,c:p.c,pin:false,at,ord:at})}}catch(e){er(e)}}
async function tAdd(){const x=$('#tx').value.trim();if(!x)return;try{await DB.collection('ticker').add({kind:$('#tkd').value,text:x,src:$('#tks').value,srcName:$('#tkn').value.trim(),at:Date.now()});$('#tx').value=''}catch(e){er(e)}}
async function tdl(id){try{await DB.doc('ticker/'+id).delete()}catch(e){er(e)}}
const api=(m,u,b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.ok?r.json():Promise.reject({code:r.status}));
async function load(){try{const[a,b]=await Promise.all([api('GET','/api/posts'),api('GET','/api/ticker')]);PS=a.map(o=>({...o,m:Math.max(0,Math.round((Date.now()-(o.at||Date.now()))/6e4))}));TK=b.sort((x,y)=>(y.at||0)-(x.at||0));refresh();drawTk()}catch(e){}}
const wr=f=>(...a)=>f(...a).then(x=>{load();return x});
DB={collection:c=>({add:wr(d=>api('POST','/api/'+c,d))}),doc:p=>{const[c,i]=p.split('/');return{update:wr(d=>api('PATCH','/api/'+c+'/'+i,d)),delete:wr(()=>api('DELETE','/api/'+c+'/'+i))}}};
async function doLogin(){try{await api('POST','/api/login',{password:$('#lp').value});ADMIN=true;nav();go('adm')}catch(e){$('#le').textContent=e.code==429?' Too many attempts, wait a few minutes':' Wrong password'}}
async function logout(){try{await api('POST','/api/logout')}catch(e){}ADMIN=false;go('feed')}
(async()=>{try{ADMIN=(await api('GET','/api/me')).admin}catch(e){}nav();await load();setInterval(load,10000)})();
wgTick();setInterval(wgTick,5000);render();drawTk();remPop();
</script></body></html>
